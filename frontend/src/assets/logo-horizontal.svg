<svg width="960" height="280" viewBox="0 0 960 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="horizontalTitle horizontalDesc">
  <title id="horizontalTitle">Interactive Youth Transport horizontal logo</title>
  <desc id="horizontalDesc">Hexagon outline with a roadway graphic to the left of the text Interactive Youth Transport.</desc>
  <defs>
    <linearGradient id="hexGradientH" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#122c60"/>
      <stop offset="50%" stop-color="#1c5c74"/>
      <stop offset="100%" stop-color="#4cb379"/>
    </linearGradient>
    <linearGradient id="roadGradientH" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e274f"/>
      <stop offset="40%" stop-color="#123760"/>
      <stop offset="100%" stop-color="#43aa71"/>
    </linearGradient>
    <style>
      .logo-text { font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; }
      .logo-subtext { font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; letter-spacing: 0.04em; }
    </style>
  </defs>
  <g transform="translate(160 140)">
    <polygon points="0,-110 96,-55 96,55 0,110 -96,55 -96,-55" fill="none" stroke="url(#hexGradientH)" stroke-width="26" stroke-linejoin="round"/>
    <path d="M-72 44 C-48 6 -20 -30 20 -64 C48 -86 80 -102 108 -82 C74 -42 48 -10 18 28 C-6 60 -32 96 -60 126 L-100 104 C-86 84 -68 66 -54 46 Z" fill="url(#roadGradientH)"/>
    <path d="M-18 120 C10 54 54 6 112 -38 L112 -10 C70 22 40 62 20 102 Z" fill="#ffffff"/>
  </g>
  <text class="logo-text" x="320" y="150" font-size="88" fill="#ffffff">Interactive</text>
  <text class="logo-subtext" x="320" y="210" font-size="54" fill="#ffffff">Youth Transport</text>
  <rect x="290" y="80" width="4" height="120" fill="#ffffff" opacity="0"/>
</svg>

